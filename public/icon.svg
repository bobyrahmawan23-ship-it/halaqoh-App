<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Islamic geometric circular border -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.3" />

  <!-- Central Star Motif / Rehal -->
  <g transform="translate(256, 230)">
    <!-- Open Book / Quran Pages -->
    <!-- Left page -->
    <path d="M-10,30 C-60,0 -120,5 -150,-50 C-150,-100 -70,-90 -10,-60 Z" fill="#f8fafc" />
    <path d="M-10,30 C-60,5 -115,10 -145,-45 C-145,-90 -75,-80 -10,-55 Z" fill="#ffffff" />
    
    <!-- Right page -->
    <path d="M10,30 C60,0 120,5 150,-50 C150,-100 70,-90 10,-60 Z" fill="#f1f5f9" />
    <path d="M10,30 C60,5 115,10 145,-45 C145,-90 75,-80 10,-55 Z" fill="#ffffff" />

    <!-- Quran text lines representation -->
    <path d="M-125,-40 C-95,-35 -40,-45 -25,-48" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7" fill="none" />
    <path d="M-130,-15 C-95,-10 -40,-20 -25,-23" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M-120,10 C-90,15 -40,5 -25,2" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <path d="M25,-48 C40,-45 95,-35 125,-40" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7" fill="none" />
    <path d="M25,-23 C40,-20 95,-10 130,-15" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M25,2 C40,5 90,15 120,10" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Bookmark ribbon -->
    <path d="M0,-58 L0,55 L-8,45 L-16,55 L-16,-55 Z" fill="url(#goldGrad)" />
    
    <!-- Wooden Rehal / Bookstand base -->
    <path d="M-120,70 L-40,25 L40,25 L120,70 L100,85 L40,45 L-40,45 L-100,85 Z" fill="url(#goldGrad)" />
    <path d="M-80,85 L0,30 L80,85 L60,95 L0,50 L-60,95 Z" fill="#ca8a04" />
  </g>

  <!-- Crescent and Star at top -->
  <path d="M256,70 C240,70 225,82 225,98 C225,114 240,126 256,126 C247,126 238,114 238,98 C238,82 247,70 256,70 Z" fill="url(#goldGrad)" />
  <circle cx="264" cy="98" r="4" fill="url(#goldGrad)" />

  <!-- App Title Acronym / Typography -->
  <text x="256" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="3">HALAQOH</text>
  <text x="256" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="#34d399" text-anchor="middle" letter-spacing="4">PRESENSI &amp; CAPAIAN</text>
</svg>
